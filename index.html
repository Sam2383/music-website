<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CASMusic</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- Custom CSS -->
    <link rel="stylesheet" href="index.css" />
  </head>
  <body>
    <!-- Title -->
    <header class="text-center mb-5">
      <h1 class="site-title">CASMusic</h1>
    </header>

    <!-- Cards Container -->
    <div class="container d-flex flex-wrap justify-content-center gap-4 mb-4">
      <!-- Spotify Card -->
      <div class="card custom-card text-center">
        <img
          src="spotify-logo.png"
          class="card-img-top card-image"
          alt="Spotify Logo"
        />
      </div>

      <!-- SoundCloud Card -->
      <div class="card custom-card text-center">
        <img
          src="soundcloud-white-icon.png"
          class="card-img-top card-image"
          alt="SoundCloud Logo"
        />
      </div>
    </div>

    <!-- Dropdown -->
    <div class="text-center mb-4">
      <div class="dropdown">
        <button
          class="btn btn-outline-light dropdown-toggle"
          type="button"
          data-bs-toggle="dropdown"
          aria-expanded="false"
        >
          Other Music Providers
        </button>
        <ul class="dropdown-menu dropdown-menu-dark">
          <li><a class="dropdown-item" href="#">Apple Music</a></li>
          <li><a class="dropdown-item" href="#">YouTube Music</a></li>
          <li><a class="dropdown-item" href="#">Amazon Music</a></li>
        </ul>
      </div>
    </div>

    <!-- Footer Text -->
    <footer class="text-center mt-3">
      <p class="footer-text">Listen to all your favourite playlists in one place.</p>
    </footer>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
